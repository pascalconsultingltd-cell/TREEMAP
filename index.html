<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  body { display: flex; }
  #side { display: none; position: relative; width: 25%; box-sizing: border-box; background: #fafaf7; border-right: 1px solid #ddd; }

  #grab { display: none; flex: none; height: 24px; cursor: grab; touch-action: none; } #grab::after { content: ''; display: block; width: 44px; height: 5px; margin: 9px auto 0; border-radius: 3px; background: #bbb; }
  .tinfo { font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
  #side h3 { margin: 0 0 8px; } #side h3 small { font-weight: normal; color: #666; }
  #map { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #map { flex: 1; background: #f2efe9; }
  body.open #side { display: flex; flex-direction: column; }
  #closeSide { position: absolute; top: 6px; right: 8px; cursor: pointer; font-size: 18px; color: #666; } #closeSide:hover { color: #000; }
  @media (max-width: 700px) {
    body { display: block; } #map { position: absolute; inset: 0; }

    #grab { display: block; } #sideBody { padding-top: 0; } #closeSide { top: 2px; right: 4px; padding: 8px 12px; font-size: 20px; z-index: 1; }

  .panel { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 4px #0004; font-size: 13px; line-height: 1.5; }

  .btn.active { background: #1a9850; color: #fff; }

  .ramp .bar { height: 8px; border-radius: 4px; background: linear-gradient(to right, #e5f5e0, #74c476, #00441b); }
  .ramp div:last-child { margin-top: 3px; } .ramp div:last-child span { width: auto; }
  .guide div { transition: transform .15s linear; font-size: 64px; line-height: 70px; text-align: center; font-weight: bold; text-shadow: 0 0 4px #fff, 0 0 8px #fff, 0 0 2px #000; }
  .gtip span { position: relative; left: -50%; display: inline-block; white-space: nowrap; font: 600 12px sans-serif; background: #fff; border: 2px solid #333; border-radius: 6px; padding: 2px 6px; box-shadow: 0 1px 4px #0005; }
  .stop div { width: 20px; height: 20px; border-radius: 50%; text-align: center; font: bold 12px/20px sans-serif; box-shadow: 0 0 0 1.5px #000; }
  #side ol { padding-left: 20px; } #side li { margin-bottom: 3px; }
  .head { user-select: none; } .fold, .reset { cursor: pointer; font-size: 16px; line-height: 16px; } .fold { float: right; margin: -6px -8px -6px 4px; padding: 6px 10px; } .reset { margin-right: 6px; }
  .panel.folded { padding: 10px 12px; cursor: pointer; } .panel.folded > div:not(.head), .panel.folded .head b, .panel.folded .reset, .panel.folded .help, .panel.folded .logo { display: none; }
  .logo { width: 22px; height: 22px; border-radius: 5px; vertical-align: -6px; margin-right: 6px; } .panel.folded .fold { margin: 0; }
  .sel { font-size: 12px; margin-left: 4px; cursor: pointer; }
  .panel { overflow-y: auto; box-sizing: border-box; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .sec { border-top: 1px solid #e3e3e3; padding-top: 4px; margin-top: 4px; } .sec-t { font-weight: 600; font-size: 12px; color: #555; margin-bottom: 2px; }
  .fhead { cursor: pointer; font-size: 13px; color: #222; } .fhead span { float: right; } .filters.shut > div:last-child { display: none; }
  .filters .sec { margin-left: 8px; }
  .dur { display: inline-flex; margin-right: 4px; } .dur .btn { margin-right: 0; border-radius: 0; background: #fff; } .dur .btn:first-child { border-radius: 12px 0 0 12px; }
  .dur .btn:last-child { border-radius: 0 12px 12px 0; border-left: none; } .dur .btn.on { background: #1a9850; color: #fff; }
  .city { margin: 4px 0 2px; }
  .walks { margin: 4px 0 2px; font-size: 12px; } .wtitle { cursor: pointer; } .wtitle span { float: right; }
  .witem { display: none; justify-content: space-between; gap: 6px; padding: 2px 4px; cursor: pointer; } .walks.open .witem { display: flex; } .witem:hover { background: #0001; }
  .witem .x { color: #b00; cursor: pointer; padding: 0 4px; }
  #spq { width: 100%; box-sizing: border-box; padding: 5px 8px; margin: 3px 0 4px; border: 1px solid #bbb; border-radius: 8px; font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; } .chip { display: inline-flex; align-items: center; padding: 3px 8px; border: 1px solid #ccc; border-radius: 12px; background: #fff; font: 12px sans-serif; cursor: pointer; } .chip .dot { margin-right: 4px; }
  #sortBy { float: right; font-size: 11px; } .favmode .row.isfav::after { content: ' ⭐'; }
  .locbtn a { font-size: 16px; } .locbtn a.on { background: #d2e3fc; } .locbtn a.away { background: #fff3c4; }
  .stop.done div { opacity: .35; } .stop.next div { outline: 3px solid #1a9850; outline-offset: 2px; transform: scale(1.3); }
  .wbar h3 { margin: 0 0 2px; } .wbar .wd { color: #1a6; font-weight: 600; } .wbar .go { background: #1a9850; color: #fff; font-weight: 600; }
  .row { cursor: pointer; user-select: none; }
  .row:hover { background: #0001; }
  #side .big { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block; }
  #side .cap { font-size: 11px; color: #666; margin: 4px 0 10px; }
  #side .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #side figure { margin: 0; cursor: zoom-in; } #side figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; }
  #side .big { cursor: zoom-in; touch-action: pan-y; user-select: none; -webkit-user-drag: none; } #lbImg { touch-action: pan-y; user-select: none; }
  .gal { position: relative; } .gal .nav { position: absolute; top: 50%; transform: translateY(-50%); background: #0006; color: #fff; font-size: 26px; line-height: 34px; width: 30px; text-align: center; border-radius: 4px; cursor: pointer; user-select: none; }
  .gal .l { left: 4px; } .gal .r { right: 4px; } .gal .count { position: absolute; bottom: 6px; right: 8px; background: #0008; color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 8px; }
  #lightbox { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.92); flex-direction: column; align-items: center; justify-content: center; }
  #lbImg { max-width: 95vw; max-height: 88vh; object-fit: contain; } #lbCap { color: #ddd; font-size: 13px; margin-top: 8px; } #lbCap a { color: #9cf; }
  #lbClose { position: absolute; top: 10px; right: 18px; color: #fff; font-size: 28px; cursor: pointer; }
  #side .back { margin: 0 0 8px; } #side li { cursor: pointer; } #side li:hover { background: #0001; }
  #side h4 { margin: 12px 0 6px; }
  #side figcaption { font-size: 12px; text-align: center; } #side figure.on img { outline: 3px solid #2a6; }
  .help { cursor: pointer; font-size: 14px; color: #666; margin-right: 6px; }
  #dlg { position: fixed; inset: 0; z-index: 3000; background: #0006; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #dlg .box { background: #fff; border-radius: 12px; padding: 16px; width: 100%; max-width: 380px; box-shadow: 0 6px 24px #0006; font-size: 15px; line-height: 1.45; max-height: 86vh; overflow-y: auto; }
  #dlg input { width: 100%; box-sizing: border-box; margin: 10px 0 2px; padding: 9px 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
  #dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; } #dlg .acts button { padding: 9px 14px; font: inherit; border-radius: 8px; border: 1px solid #888; background: #fff; cursor: pointer; } #dlg .acts .ok { background: #1a9850; border-color: #1a9850; color: #fff; }
  #dlg ul { padding-left: 4px; list-style: none; margin: 8px 0 0; } #dlg li { margin-bottom: 7px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 2500; background: #222d; color: #fff; padding: 8px 14px; border-radius: 18px; font-size: 13px; max-width: 86vw; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #toast.show { opacity: 1; }
  .btn { margin: 4px 4px 6px 0; padding: 3px 8px; border: 1px solid #888; border-radius: 12px; background: #e8f5e0; cursor: pointer; font: inherit; }
  .btn.off { background: #fff; opacity: 0.45; text-decoration: line-through; }
  .row.off { opacity: 0.35; text-decoration: line-through; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  /* Phones: finger-sized targets (last, so they win over the base styles above) */
  @media (max-width: 700px) {
    .btn { padding: 8px 12px; font-size: 14px; } .row { padding: 8px 2px; font-size: 15px; } .chip { padding: 7px 10px; font-size: 13px; }
    .sel { display: inline-block; padding: 6px 0; font-size: 14px; } .sel input { width: 20px; height: 20px; vertical-align: -4px; }
    .fhead, .wtitle { padding: 8px 0; font-size: 14px; } .witem { padding: 9px 4px; font-size: 14px; } .witem .x { padding: 0 10px; }
    .reset, .help { padding: 6px 8px 6px 0; font-size: 20px; } .fold { font-size: 20px; padding: 8px 12px; margin: -8px -10px -8px 4px; } .panel.folded { padding: 14px 16px; }
    #sortBy { font-size: 13px; padding: 4px; } #spq { padding: 9px 10px; font-size: 16px; } .gal .nav { width: 40px; line-height: 48px; font-size: 32px; }
    #side li { padding: 7px 0; } .stop div { transform: scale(1.25); } .stop.next div { transform: scale(1.5); } #lbClose { padding: 8px 12px; top: 4px; right: 6px; }
    .leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; }
  }
</style>
</head>
<body>
<div id="side"><div id="grab"></div><span id="closeSide" title="Fermer" onclick="closeSheet()">✕</span><div id="sideBody"></div></div>
<div id="map"></div>
<div id="toast"></div>
<div id="lightbox" onclick="if (event.target === this) closeBig()"><span id="lbClose" title="Fermer" onclick="closeBig()">✕</span><img id="lbImg"><div id="lbCap"></div></div>
<script src="lib/leaflet/leaflet.min.js"></script>
<script>
// City: ?city=bcn or the last one chosen on this device, London by default; its basemap and trees load before the map script
const CITY = (new URLSearchParams(location.search).get('city') || (() => { try { return localStorage.getItem('treemap.city'); } catch (e) {} })()) === 'bcn' ? 'bcn' : 'london';
const V = '?v=20261030';  // bump when data files change, so browsers don't keep stale copies
document.write(CITY === 'bcn' ? `<script src="basemap_bcn.js${V}"><\/script><script src="trees_bcn.js${V}"><\/script>` : `<script src="basemap.js${V}"><\/script><script src="trees.js${V}"><\/script>`);
</script>
<script>document.write(`<script src="photos.js${V}"><\/script>`);</script>
<script>
const HOMENAME = typeof HOME !== 'undefined' ? HOME : 'NW5 2TE';
const PHONE = innerWidth <= 700;  // phones: full-screen map, one bottom sheet, no popups
// Taps on a phone land up to 12 px from a tree dot and still count; a mouse needs to be within 3 px
const map = L.map('map', { preferCanvas: true, renderer: L.canvas({ tolerance: L.Browser.mobile ? 12 : 3 }), minZoom: 14, maxZoom: 19 }).setView(CENTRE, 15);
// Own basemap from basemap.js (OSM data stored locally): no tile servers
map.attributionControl.addAttribution('&copy; OpenStreetMap contributors | Trees: ' + (CITY === 'bcn' ? 'Ajuntament de Barcelona (CC BY 4.0)' : 'GLA Public Realm Trees'));
const B = BASEMAP, line = (k, o) => B[k].forEach(p => L.polyline(p, { interactive: false, ...o }).addTo(map));
B.green.forEach(p => L.polygon(p, { interactive: false, stroke: false, fillColor: '#cfe8c4', fillOpacity: 1 }).addTo(map));
B.water.forEach(p => L.polygon(p, { interactive: false, stroke: false, fillColor: '#aad3df', fillOpacity: 1 }).addTo(map));
B.building.forEach(p => L.polygon(p, { interactive: false, color: '#c9c2b8', weight: 0.5, fillColor: '#ddd7cf', fillOpacity: 1 }).addTo(map));
line('path', { color: '#b5aea4', weight: 1, dashArray: '2 3' });
line('rail', { color: '#888', weight: 2, dashArray: '6 4' });
line('minor', { color: '#fff', weight: 4 });
line('major', { color: '#f7d58b', weight: 6 });
// Street names only when zoomed in, otherwise they clutter
const labels = L.layerGroup(B.labels.map(([n, p]) => L.tooltip({ permanent: true, direction: 'center', className: 'street' }).setLatLng(p).setContent(n)));
map.on('zoomend', () => map.getZoom() >= 17 ? labels.addTo(map) : labels.remove());
L.circle(CENTRE, { radius: RADIUS_M, color: '#2a6', weight: 2, fill: false, dashArray: '6 6' }).addTo(map);
L.marker(CENTRE).addTo(map).bindPopup(HOMENAME).on('click', () => { routeLayer.clearLayers(); endWalk(); });  // clicking home clears the route
// French names: by GLA group, and by genus for trees the GLA files as "Other"
const FR = { Orange: 'Oranger amer', 'Tipu tree': 'Tipuana', Jacaranda: 'Jacaranda', Chinaberry: 'Lilas de Perse', 'Pagoda tree': 'Sophora du Japon', Palm: 'Palmier',
  Carob: 'Caroubier', Olive: 'Olivier', Fig: 'Figuier', Loquat: 'Néflier du Japon', 'Bottle tree': 'Arbre-bouteille', 'Pepper tree': 'Faux poivrier',
  'Norfolk hibiscus': 'Lagunaria', 'She-oak': 'Filao', 'Orchid tree': 'Arbre à orchidées', 'Coral tree': 'Érythrine', 'Judas tree': 'Arbre de Judée', Pomegranate: 'Grenadier',
  Persimmon: 'Kaki', Jujube: 'Jujubier', Bay: 'Laurier-sauce', 'Strawberry-tree': 'Arbousier', 'Crape myrtle': 'Lilas des Indes', Eucalyptus: 'Eucalyptus',
  'Silk tree': 'Arbre à soie', 'Camphor tree': 'Camphrier', 'Silk floss tree': 'Arbre à kapok', Pittosporum: 'Pittosporum', Photinia: 'Photinia', Oak: 'Chêne', Cherry: 'Cerisier', Maple: 'Érable', Lime: 'Tilleul', Plane: 'Platane', Ash: 'Frêne', Birch: 'Bouleau', Other: 'Autre', Apple: 'Pommier',
  Sycamore: 'Érable sycomore', Whitebeam: 'Alisier blanc', Rowan: 'Sorbier des oiseleurs', Hawthorn: 'Aubépine', Juneberry: 'Amélanchier', Serviceberry: 'Amélanchier',
  'Black locust': 'Robinier faux-acacia', Pear: 'Poirier', Hornbeam: 'Charme', 'Horse Chestnut': 'Marronnier', Oak: 'Chêne', Elder: 'Sureau noir', 'Tree-of-heaven': 'Ailante',
  Alder: 'Aulne', Holly: 'Houx', Ginko: 'Ginkgo', Ginkgo: 'Ginkgo', 'Black walnut': 'Noyer noir', 'Pride-of-India': 'Savonnier', Hazel: 'Noisetier', 'Turkish hazel': 'Noisetier de Byzance', Mulberry: 'Mûrier', Willow: 'Saule', Elm: 'Orme', Sweetgum: "Copalme d'Amérique",
  Ironwood: 'Parrotie de Perse', Cypress: 'Cyprès', Poplar: 'Peuplier', Pine: 'Pin', 'Honey Locust': "Févier d'Amérique", Walnut: 'Noyer', Beech: 'Hêtre',
  Chestnut: 'Châtaignier', 'Nettle Tree': 'Micocoulier', Magnolia: 'Magnolia', Yew: 'If', Catalpa: 'Catalpa', Tuliptree: 'Tulipier de Virginie', Privet: 'Troène', Redwood: 'Métaséquoia' };
const FR_GENUS = { Acacia: 'Acacia', Arbutus: 'Arbousier', Buddleja: 'Buddleia', Carpinus: 'Charme', Carya: 'Caryer', Cedrus: 'Cèdre', Ceanothus: 'Céanothe',
  Cercis: 'Arbre de Judée', Chamaecyparis: 'Faux-cyprès', Clerodendrum: 'Clérodendron', Cordyline: 'Cordyline', Cornus: 'Cornouiller', Cotinus: 'Arbre à perruque',
  Cotoneaster: 'Cotonéaster', Cytisus: 'Genêt', Davidia: 'Arbre aux mouchoirs', Eriobotrya: 'Néflier du Japon', Eucalyptus: 'Eucalyptus', Euonymus: 'Fusain',
  Fagus: 'Hêtre', Ficus: 'Figuier', Fraxinus: 'Frêne', Hippophae: 'Argousier', Ilex: 'Houx', Juglans: 'Noyer', Juniperus: 'Genévrier', Laburnum: 'Cytise',
  Larix: 'Mélèze', Laurus: 'Laurier', Ligustrum: 'Troène', Lythraceae: 'Lilas des Indes', Magnolia: 'Magnolia', Mespilus: 'Néflier', Morus: 'Mûrier', Nyssa: 'Nyssa',
  Olea: 'Olivier', Paulownia: 'Paulownia', Photinia: 'Photinia', Pittosporum: 'Pittosporum', Pterocarya: 'Ptérocaryer', Pyrus: 'Poirier', Rhus: 'Sumac',
  Syringa: 'Lilas', Tamarix: 'Tamaris', Taxus: 'If', Thuja: 'Thuya', Tilia: 'Tilleul', Yucca: 'Yucca', Zelkova: 'Zelkova' };
// Legend group: GLA name, except Turkish hazel split from common hazel, and some genera pulled out of "Other"
const BY_GENUS = { Morus: 'Mulberry', Fagus: 'Beech', Pyrus: 'Pear', Ginkgo: 'Ginkgo', Juglans: 'Walnut', Ficus: 'Fig', Populus: 'Poplar', Quercus: 'Oak' };
const group = t => t.taxon_species.startsWith('Corylus colurna') ? 'Turkish hazel' : t.taxon_species.startsWith('Juglans nigra') ? 'Black walnut' : BY_GENUS[t.taxon_species.split(' ')[0]] || t.gla_name;
const frName = t => group(t).trim() !== 'Other' && FR[group(t).trim()] || FR_GENUS[t.taxon_species.split(' ')[0]] || (CITY === 'bcn' ? t.common_name : 'Autre');  // Barcelona: Spanish name when no French one
// Season photos per legend group (photos.js); big photo is the current season, thumbnails switch it
const SEASON_FR = { spring: 'Printemps', summer: 'Été', autumn: 'Automne', winter: 'Hiver' };
const NOW = ['winter', 'winter', 'spring', 'spring', 'spring', 'summer', 'summer', 'summer', 'autumn', 'autumn', 'autumn', 'winter'][new Date().getMonth()];
// Close-ups under the seasons when available; maple, sycamore and ash fruits are samaras, pine fruits are cones
const PARTS = { leaf: 'Feuille', flower: 'Fleur', fruit: 'Fruit', bark: 'Écorce' };
const label = (g, k) => SEASON_FR[k] || (k === 'fruit' && /^(Maple|Sycamore|Ash|Elm)$/.test(g) ? 'Samares' : k === 'fruit' && g === 'Pine' ? 'Cône' : PARTS[k]);
const caption = (g, k) => { const p = PHOTOS[g][k]; return `${label(g, k)}${k === NOW ? ' (maintenant)' : ''}${p.season && p.season !== k ? ` : pas de photo, voici ${SEASON_FR[p.season].toLowerCase()}` : ''} · <a href="${p.page}" target="_blank">${p.credit}</a>`; };
// Side panel: clicked tree with its group's photos, current season big, the 4 seasons and the close-ups below
// Panel opens on a tree, legend row or walk, closes with ✕; the map is resized each time
const side = document.getElementById('sideBody');
const sideBox = document.getElementById('side');
const showSide0 = (open, frac = 0.55) => { document.body.classList.toggle('open', open); if (PHONE) sideBox.style.height = Math.round(frac * innerHeight) + 'px'; map.invalidateSize(); fitLegend(); };
const sheetH = () => PHONE && document.body.classList.contains('open') ? sideBox.offsetHeight : 0;  // map height hidden by the sheet
// Drag the sheet's handle: it snaps to about a quarter, half or nearly all of the screen, or closes below that; a tap toggles half / nearly full
(() => {
  const grab = document.getElementById('grab'); let y0 = null, moved = false;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; moved = false; grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove', e => { if (y0 === null) return; if (Math.abs(e.clientY - y0) > 6) moved = true; if (moved) sideBox.style.height = Math.max(60, innerHeight - e.clientY) + 'px'; });
  grab.addEventListener('pointerup', () => {
    if (y0 === null) return; y0 = null;
    const f = sideBox.offsetHeight / innerHeight;
    if (!moved) return showSide0(true, f > 0.7 ? 0.55 : 0.92);
    if (f < 0.16) return closeSheet();
    showSide0(true, [0.28, 0.55, 0.92].reduce((a, b) => Math.abs(b - f) < Math.abs(a - f) ? b : a));
  });
})();
// Phones: bring a tree into the part of the map the sheet leaves visible
const centreTree = t => { const p = map.latLngToContainerPoint([t.lat, t.lon]), z = map.getSize(); map.panBy([p.x - z.x / 2, p.y - (z.y - sheetH()) / 2]); };
// Fit padding keeping a route clear of the sheet (phone) or the legend (computer)
const pad = n => ({ paddingTopLeft: [n, n], paddingBottomRight: PHONE ? [n, sheetH() + n] : [legendW() + n, n] });
const foldOnPhone = () => { const p = document.querySelector('.panel'); if (PHONE && !p.classList.contains('folded')) p.querySelector('.fold').click(); };
// The legend scrolls inside the visible map, whatever its height (phone bars, photo panel open), above the credits line
const fitLegend = () => { const p = document.querySelector('.panel'); if (p) p.style.maxHeight = (map.getSize().y - sheetH() - 44) + 'px'; };
const showSide = t => { showPhotos(group(t).trim(), t.common_name, `${frName(t)} · <i>${t.taxon_species}</i>`, PHONE ? t.info() : ''); if (PHONE) centreTree(t); };
const tiles = (g, keys) => '<div class="grid">' + keys.map(k => `<figure class="${k === NOW ? 'on' : ''}" onclick="openBig('${g}', '${k}')"><img src="${PHOTOS[g][k].src}"><figcaption>${label(g, k)}</figcaption></figure>`).join('') + '</div>';
let photosOpen = false;
function showPhotos(g, title, sub, extra = '') {
  photosOpen = true;

  side.innerHTML = `<h3>🧺 ${w.name ? esc(w.name) : 'Balade cueillette'}${w.sel ? ' · avec sélection' : ''}${w.ripe ? ' · de saison' : ''}<br><small>${stops.length} espèces · ${Math.round(w.used / 83.3)} min · ${(w.used / 1000).toFixed(2)} km, retour à ${HOMENAME}</small></h3>
    <button class="btn wgo" onclick="startWalk()">▶️ Démarrer</button><button class="btn" onclick="forageLoop()">🔀 Autre balade</button>${w.id ? `<button class="btn" onclick="renameWalk(${w.id})">✏️ Renommer</button><button class="btn" onclick="deleteWalk(${w.id})">🗑 Supprimer</button>` : '<button class="btn" onclick="saveWalk()">💾 Sauver</button>'}<button class="btn" onclick="shareWalk()">🔗 Partager</button>
    <ol>${stops.map(t => `<li onclick="showStop(${t.uniqueid})"><b>${frName(t)}</b> : ${edible(t) || tea(t) || 'non comestible'}</li>`).join('')}</ol>`;
}
// Walk mode: a small bar with the next stop and its live distance, 📍 on and following; ✅ moves on, numbers of done stops fade
let walkMode = null, stopMk = [];
function startWalk() {
  walkMode = { i: 0 }; if (watch === null && navigator.geolocation) toggleLocate(); else { follow = true; followMe(); }
  walkBar();
}
function walkBar() {
  photosOpen = false; showSide0(true, 0.24);
  const n = current.ids.length, i = walkMode.i, t = i < n ? byId[current.ids[i]] : null;
  stopMk.forEach((m, k) => { const e = m.getElement(); if (e) { e.classList.toggle('done', k < i); e.classList.toggle('next', k === i); } });
  side.innerHTML = t ? `<div class="wbar"><h3>${i + 1}/${n} · ${frName(t)}</h3><small>${edible(t) || tea(t) || 'non comestible'}</small> <span class="wd" id="wd"></span><br>
      <button class="btn go" onclick="walkStep(1)">✅ Suivant</button>${i ? '<button class="btn" onclick="walkStep(-1)">← Précédent</button>' : ''}<button class="btn" onclick="showStop(${t.uniqueid})">🌳 Voir l’arbre</button></div>`
    : `<div class="wbar"><h3>🎉 Balade terminée</h3><small>${n} espèces. Retour à ${HOMENAME}.</small> <span class="wd" id="wd"></span><br><button class="btn" onclick="exitWalk()">Fermer</button></div>`;
  walkDist();
  if (!myPos || !follow) { const c = t ? [t.lat, t.lon] : CENTRE, p = map.project(c).add([0, sheetH() / 2]); map.panTo(map.unproject(p)); }
}
const walkStep = d => { walkMode.i = Math.max(0, walkMode.i + d); walkBar(); };
function walkDist() {
  const el = document.getElementById('wd'); if (!el || !walkMode || !myPos) return;
  const t = byId[current.ids[walkMode.i]], m = dist(myPos, t ? [t.lat, t.lon] : CENTRE);
  el.textContent = `· ${Math.round(m)} m (${Math.max(1, Math.round(m / 83.3))} min)`;
}
function exitWalk() { walkMode = null; stopMk.forEach(m => { const e = m.getElement(); if (e) e.classList.remove('done', 'next'); }); showWalk(current); }
// Saved walks live in this browser's storage (one phone or computer), 10 at most
const WALKS_KEY = 'treemap.walks' + (CITY === 'bcn' ? '.bcn' : '');  // each city keeps its own walks
const loadWalks = () => { try { return JSON.parse(localStorage.getItem(WALKS_KEY)) || []; } catch (e) { return []; } };
const storeWalks = ws => { try { localStorage.setItem(WALKS_KEY, JSON.stringify(ws)); } catch (e) { toast('Impossible de sauver sur cet appareil.', 5000); } fillWalks(); };
async function saveWalk() {
  const ws = loadWalks();
  if (ws.length >= 10 && !await ask({ msg: '10 balades déjà sauvées : remplacer la plus ancienne ?', ok: 'Remplacer' })) return;
  const name = await ask({ msg: 'Nom de la balade :', ok: 'Sauver', input: `Balade du ${new Date().toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })} · ${current.ids.length} espèces` });
  if (!name) return;
  current = { ...current, name, id: Date.now() };
  storeWalks([...ws, current].slice(-10)); showWalk(current);
}
async function deleteWalk(id) {
  const w = loadWalks().find(x => x.id === id);
  if (!w || !await ask({ msg: `Supprimer « ${esc(w.name)} » ?`, ok: 'Supprimer' })) return;
  storeWalks(loadWalks().filter(x => x.id !== id));
  if (current && current.id === id) { current = { ...current, id: undefined, name: undefined }; showWalk(current); }
}
// Share: a walk is rebuilt from its ordered trees, so a link carries just their ids (and the name)
// Links always point to the public site: a file:// or localhost link is useless elsewhere, and Chrome's share sheet crashes on file:// URLs
const SITE = 'https://pascalconsultingltd-cell.github.io/TREEMAP/';
function shareWalk() {
  const base = (location.protocol === 'https:' ? location.origin + location.pathname : SITE) + (CITY === 'bcn' ? '?city=bcn' : '');
  const url = `${base}#walk=${current.ids.join(',')}${current.name ? '&name=' + encodeURIComponent(current.name) : ''}`;
  if (navigator.share) navigator.share({ title: current.name || 'Balade cueillette', url }).catch(() => {});
  else navigator.clipboard.writeText(url).then(() => toast('🔗 Lien copié'), () => ask({ msg: 'Copie ce lien :', input: url, ok: 'Fermer' }));
}
function walkFromIds(ids, name) {
  const g = graphs().walk, snap = G.snap = G.snap || new Map(), line = [CENTRE], trees = ids.map(id => byId[id]).filter(Boolean);
  let cur = g.home, used = 0;
  trees.forEach(t => {
    const n = snap.get(t) ?? snap.set(t, g.nearest([t.lat, t.lon], i => g.H.d[i] < Infinity)).get(t), D = g.dijkstra(cur);
    line.push(...g.path(D, n).reverse(), [t.lat, t.lon], g.pts[n]); used += D.d[n] + 2 * dist([t.lat, t.lon], g.pts[n]); cur = n;
  });
  line.push(...g.path(g.H, cur), CENTRE); used += g.H.d[cur];
  return { line, ids: trees.map(t => t.uniqueid), used, name };
}
// Opening a shared link shows its walk (it can then be saved on this device)
function openFromHash() {
  const h = new URLSearchParams(location.hash.slice(1)), ids = (h.get('walk') || '').split(',').map(Number).filter(Boolean);
  if (!ids.length) return;
  showWalk(walkFromIds(ids, h.get('name') || undefined));
  history.replaceState(null, '', location.pathname + location.search);  // a reload then shows the normal map
}
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fillWalks() {
  const ws = loadWalks();
  savedWalks.innerHTML = `<div class="wtitle">📂 Balades sauvées (${ws.length}/10) <span>${savedWalks.classList.contains('open') ? '▾' : '▸'}</span></div>` +
    ws.map(w => `<div class="witem" data-id="${w.id}"><span>${esc(w.name)}</span><b class="x" title="Supprimer">✕</b></div>`).join('');
}
// A stop of the walk: its photos in the panel (with the way back to the walk) and its popup on the map
function showStop(id) { const t = byId[id]; showSide(t); if (!PHONE) { map.panTo([t.lat, t.lon]); t.marker.openPopup(); } }
async function renameWalk(id) {
  const ws = loadWalks(), w = ws.find(x => x.id === id), name = w && await ask({ msg: 'Nouveau nom :', input: w.name, ok: 'Renommer' });
  if (!name) return;
  w.name = name; storeWalks(ws);
  if (current && current.id === id) { current.name = name; showWalk(current); }
}
const openSaved = id => { const w = loadWalks().find(x => x.id === id); if (w) showWalk(w); };

fillWalks();
openFromHash();
// In-app dialog: resolves with true (or the typed text) on OK, null on cancel or a tap outside
function ask({ msg, input, ok = 'OK', cancel = 'Annuler' }) {
  return new Promise(done => {
    const d = document.createElement('div'); d.id = 'dlg';
    d.innerHTML = `<div class="box"><div>${msg}</div>${input !== undefined ? '<input>' : ''}<div class="acts">${cancel ? `<button class="no">${cancel}</button>` : ''}<button class="ok">${ok}</button></div></div>`;
    document.body.appendChild(d);
    const box = d.querySelector('input'); if (box) { box.value = input; box.focus(); box.select(); }
    const end = v => { d.remove(); done(v); };
    d.querySelector('.ok').onclick = () => end(box ? box.value.trim() || null : true);
    if (cancel) d.querySelector('.no').onclick = () => end(null);
    d.onclick = e => { if (e.target === d) end(null); };
    if (box) box.onkeydown = e => { if (e.key === 'Enter') d.querySelector('.ok').click(); };
  });
}
// Tips shown once on each device, and again from ❓ in the legend
const showTips = () => ask({ ok: 'C’est parti', cancel: '', msg: `<b>🌳 Bienvenue</b><ul>
  <li>👆 <b>Touche un arbre</b> : ses photos et ses infos. Glisse la photo pour voir les autres.</li>
  <li>✋ <b>Appui long sur un arbre</b> : seulement son espèce. Encore : tout revient.</li>
  <li>◂ <b>La légende</b> (en haut à droite) : recherche, filtres, tri, ville.</li>
  <li>🧺 <b>Balade</b> : un parcours cueillette de 30 min ou 1 h, puis ▶️ Démarrer pour être guidé.</li>
  <li>🧭 <b>Le plus proche</b> : une flèche vers l’arbre le plus proche de l’espèce choisie, + pour le suivant.</li>
  <li>📍 <b>Ta position</b> : la carte te suit ; touche 📍 pour recentrer.</li></ul>` });
try { if (!localStorage.getItem('treemap.tips') && !location.hash) { localStorage.setItem('treemap.tips', '1'); showTips(); } } catch (e) {}
// Short message at the bottom of the screen
function toast(msg, ms = 3000) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el.t); el.t = setTimeout(() => el.classList.remove('show'), ms); }
// Offline: once the service worker runs, quietly store both cities and every photo (about 40 MB), a few files at a time, and drop data from older versions
async function cacheForOffline() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  const c = await caches.open('treemap-1');
  const core = ['icon.svg', 'icon-180.png', 'icon-192.png', 'icon-512.png', 'manifest.webmanifest', 'lib/leaflet/leaflet.min.js', 'lib/leaflet/leaflet.min.css',
    'lib/leaflet/images/marker-icon.png', 'lib/leaflet/images/marker-icon-2x.png', 'lib/leaflet/images/marker-shadow.png', 'lib/leaflet/images/layers.png', 'lib/leaflet/images/layers-2x.png',
    ...['basemap.js', 'trees.js', 'basemap_bcn.js', 'trees_bcn.js', 'photos.js'].map(f => f + V)];
  const pics = [...new Set(Object.values(PHOTOS).flatMap(p => Object.values(p).map(x => x.src)))];
  const urls = [...core, ...pics], have = new Set((await c.keys()).map(r => r.url)), abs = u => new URL(u, location.href).href;
  (await c.keys()).filter(r => /\?v=/.test(r.url) && !r.url.endsWith(V)).forEach(r => c.delete(r));
  const todo = urls.filter(u => !have.has(abs(u)));
  if (!have.has(abs('index.html'))) c.add('index.html').catch(() => {});
  for (let i = 0; i < todo.length; i += 6) await Promise.all(todo.slice(i, i + 6).map(u => c.add(u).catch(() => {})));
  if (todo.length) toast('✅ Carte disponible hors ligne');
}
addEventListener('load', () => cacheForOffline().catch(() => {}));
</script>
